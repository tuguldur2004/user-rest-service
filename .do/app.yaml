name: user-rest-service
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PROFILE_DB_URL
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: PROFILE_DB_USER
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: PROFILE_DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: SOAP_SERVICE_URL
        scope: RUN_TIME
        type: GENERAL
        value: https://example.com/ws
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        type: GENERAL
        value: https://example.com
