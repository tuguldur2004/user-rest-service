# ─── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# ─── Profile DB (PostgreSQL, independent DB for REST service) ─────────────
# Default port is 5432; override with PROFILE_DB_URL when needed.
spring.datasource.url=${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/profile_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PROFILE_DB_USER:postgres}
spring.datasource.password=${PROFILE_DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── SOAP Auth Service ──────────────────────────────────────────────────────
soap.service.url=${SOAP_SERVICE_URL:http://localhost:3001/ws}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.example.userrest=INFO
logging.level.org.springframework.web=INFO
