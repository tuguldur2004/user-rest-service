# Production profile overrides
# Require explicit DB config in production (no localhost fallback)
spring.datasource.url=${PROFILE_DB_URL}
spring.datasource.username=${PROFILE_DB_USER}
spring.datasource.password=${PROFILE_DB_PASSWORD}

spring.jpa.show-sql=false
logging.level.com.example.userrest=INFO

# CORS for internet deployment (comma-separated origins)
# Example: CORS_ALLOWED_ORIGINS=https://my-frontend.com,https://www.my-frontend.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://example.com}
