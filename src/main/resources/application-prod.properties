# Database connection configuration for DigitalOcean managed PostgreSQL
spring.datasource.url=jdbc:postgresql://db-postgresql-sgp1-12965-do-user-34793633-0.e.db.ondigitalocean.com:25060/defaultdb?sslmode=require
spring.datasource.username=doadmin
spring.datasource.password=${DB_PASSWORD}

# Production profile overrides
# Require explicit DB config in production (no localhost fallback)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:profile_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
logging.level.com.example.userrest=INFO

# CORS for internet deployment (comma-separated origins)
# Example: CORS_ALLOWED_ORIGINS=https://my-frontend.com,https://www.my-frontend.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://example.com}
