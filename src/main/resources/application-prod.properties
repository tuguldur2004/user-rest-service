# Updated to use environment variables for all database connection details
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
logging.level.com.example.userrest=INFO

# CORS for internet deployment (comma-separated origins)
# Example: CORS_ALLOWED_ORIGINS=https://my-frontend.com,https://www.my-frontend.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://example.com}
